<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Las Mejores Ofertas MX</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            /* Fondo degradado oscuro a rojo */
            background: linear-gradient(180deg, #111111 0%, #3a0000 40%, #cc534d 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            color: white;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        /* Foto de perfil / Logo */
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #ff4d4d;
            margin-bottom: 20px;
            object-fit: cover;
            box-shadow: 0 0 20px rgba(255, 77, 77, 0.4);
        }

        .title {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .bio {
            font-size: 15px;
            font-weight: 400;
            margin-bottom: 30px;
            line-height: 1.5;
            color: #eeeeee;
        }

        /* Contenedor de los botones */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Estilo de los botones */
        .link-btn {
            display: flex;
            align-items: center;
            background-color: #ffffff;
            color: #333333;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 15px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .link-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }

        .link-icon {
            font-size: 24px;
            margin-right: 15px;
        }

        .link-text {
            flex-grow: 1;
            text-align: left;
        }
        
        .dots {
            color: #999;
            font-size: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Reemplaza la URL por la de tu logo real -->
        <img src="https://i.imgur.com/Tu6r0W0.png" alt="Logo" class="profile-img">
        
        <h1 class="title">Las Mejores Ofertas MX</h1>
        <p class="bio">
            🚨 ¡Cazamos errores de precio, cupones y liquidaciones extremas!<br>
            Únete a nuestra comunidad gratis 👇
        </p>

        <div class="links-container">
            <!-- Botón WhatsApp -->
            <a href="https://whatsapp.com/channel/TUENLACEAQUI" class="link-btn" target="_blank">
                <span class="link-icon">💬</span>
                <span class="link-text">Canal de WhatsApp (Recomendado)</span>
                <span class="dots">⋮</span>
            </a>

            <!-- Botón Telegram -->
            <a href="https://t.me/TUENLACEAQUI" class="link-btn" target="_blank">
                <span class="link-icon">✈️</span>
                <span class="link-text">Canal de Telegram (Más Rápido)</span>
                <span class="dots">⋮</span>
            </a>
            
            <!-- Botón Extra (Opcional) -->
            <a href="https://instagram.com/TUENLACEAQUI" class="link-btn" target="_blank">
                <span class="link-icon">📸</span>
                <span class="link-text">Síguenos en Instagram</span>
                <span class="dots">⋮</span>
            </a>
        </div>
    </div>

</body>
</html>
